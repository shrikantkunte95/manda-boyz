<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manda Boyz | Trending 2000s</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Bungee+Shade&family=Courier+Prime&family=Space+Mono:wght@400;700&display=swap"
        rel="stylesheet">

    <style>
        /* =========================================================
           EDIT THE WEBSITE'S APPEARANCE HERE
        ========================================================= */

        :root {
            --red: #ff4757;
            --blue: #00d2ff;
            --glass: rgba(255, 255, 255, 0.09);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background: lightslategrey;
            color: #fff;
            font-family: 'Space Mono', monospace;
            min-height: 100vh;
            overflow-x: hidden;
            padding-bottom: 150px;
        }

        .bg {
            position: fixed;
            inset: 0;
            z-index: -3;
            background:
                linear-gradient(rgba(0, 0, 0, 0.78),
                    rgba(0, 0, 0, 0.88)),
                url("https://images.unsplash.com/photo-1516280440614-37939bbdd4f1?auto=format&fit=crop&q=80&w=2070");
            background-size: cover;
            background-position: center;
            filter: grayscale(25%) contrast(115%);
        }

        .scanlines {
            position: fixed;
            inset: 0;
            z-index: -2;
            pointer-events: none;
            opacity: 0.18;
            background:
                linear-gradient(rgba(255, 255, 255, 0) 50%,
                    rgba(0, 0, 0, 0.25) 50%);
            background-size: 100% 4px;
        }

        /* ================= HEADER ================= */

        header {
            max-width: 1200px;
            margin: auto;
            padding: 28px 25px 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        .status {
            color: var(--blue);
            font-size: 12px;
            text-shadow: 0 0 8px var(--blue);
        }

        .badge {
            background: var(--red);
            padding: 6px 13px;
            font: 12px 'Courier Prime';
            transform: rotate(2deg);
            box-shadow: 5px 5px #000;
        }

        /* ================= MAIN ================= */

        main {
            max-width: 1200px;
            margin: auto;
            padding: 20px 25px;
        }

        /* ================= HERO ================= */

        .hero {
            text-align: center;
            padding: 16px 0;
        }

        h1 {
            font-family: 'Bungee Shade';
            font-size: clamp(2.8rem, 8vw, 6rem);
            line-height: 1;
            text-shadow: 5px 5px var(--red);
            animation: flicker 2s infinite;
            word-break: break-word;
        }

        @keyframes flicker {

            0%,
            19%,
            21%,
            23%,
            25%,
            54%,
            56%,
            100% {
                opacity: 1;
            }

            20%,
            22%,
            24%,
            55% {
                opacity: 0.8;
            }
        }

        .subtitle {
            margin-top: 15px;
            color: #bbb;
            font-size: 13px;
            line-height: 1.6;
        }

        /* ================= SECTION ================= */

        .section {
            margin: 28px 0;
        }

        .section-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 14px;
        }

        .section-title {
            font-size: 18px;
            color: var(--blue);
            text-shadow: 0 0 8px rgba(0, 210, 255, 0.5);
        }

        .section-label {
            font-size: 10px;
            color: #777;
            text-align: right;
        }

        /* ================= CARDS ================= */

        .cards {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 14px;
        }

        .card {
            background: rgba(10, 10, 10, 0.65);
            border: 1px solid rgba(255, 255, 255, 0.13);
            border-radius: 14px;
            padding: 10px;
            backdrop-filter: blur(10px);
            transition: 0.25s;
            cursor: pointer;
        }

        .card:hover {
            transform: translateY(-6px);
            border-color: var(--red);
            box-shadow: 0 12px 30px #000;
        }

        .cover {
            aspect-ratio: 1;
            border-radius: 10px;
            overflow: hidden;
            position: relative;
            background: #222;
        }

        .cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .cover .play {
            position: absolute;
            right: 9px;
            bottom: 9px;
            width: 38px;
            height: 38px;
            border: 0;
            border-radius: 50%;
            background: var(--red);
            color: #fff;
            opacity: 0;
            cursor: pointer;
        }

        .card:hover .play {
            opacity: 1;
        }

        .song {
            margin-top: 9px;
            font-size: 12px;
            font-weight: bold;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .artist {
            margin-top: 4px;
            color: #888;
            font-size: 10px;
        }

        /* ================= FEATURE ================= */

        .feature {
            display: grid;
            grid-template-columns: 1.2fr 1fr;
            gap: 18px;
        }

        .panel {
            background: var(--glass);
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 18px;
            padding: 20px;
            backdrop-filter: blur(15px);
            min-width: 0;
        }

        /* ================= CASSETTE ================= */

        .cassette {
            min-height: 320px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .cassette-box {
            height: 260px;
            width: min(90%, 500px);
            background: #333;
            border: 4px solid #111;
            border-radius: 12px;
            padding: 12px;
            box-shadow: 0 20px 45px #000;
        }

        .cassette-label {
            height: 100%;
            background: #eee;
            border-radius: 5px;
            color: #222;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 15px;
        }

        .cassette-label strong {
            font: 24px 'Courier Prime';
            border-bottom: 2px solid #333;
            text-align: center;
            line-height: 1.3;
        }

        .reels {
            display: flex;
            gap: 80px;
            margin-bottom: 32px;
        }

        .reel {
            width: 80px;
            height: 80px;
            border: 6px dashed #333;
            border-radius: 50%;
            animation: spin 3s linear infinite paused;
        }

        .cassette-box.playing .reel {
            animation-play-state: running;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .quote {
            text-align: center;
            color: #ccc;
            font-style: italic;
            padding: 12px 0;
            min-height: 50px;
        }

        /* ================= PARTY HOURS LIST ================= */

        .list {
            display: flex;
            flex-direction: column;
            gap: 8px;

            max-height: 330px;
            overflow-y: auto;
            padding-right: 5px;

            scrollbar-width: thin;
            scrollbar-color: var(--red) rgba(255, 255, 255, 0.08);
        }

        .list::-webkit-scrollbar {
            width: 6px;
        }

        .list::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
        }

        .list::-webkit-scrollbar-thumb {
            background: var(--red);
            border-radius: 10px;
        }

        .list-row {
            display: grid;
            grid-template-columns: 30px minmax(0, 1fr) auto;
            align-items: center;
            gap: 10px;
            padding: 10px;
            min-height: 58px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.04);
            cursor: pointer;
            transition: 0.2s;
        }

        .list-row:hover,
        .list-row.active {
            background: rgba(255, 71, 87, 0.13);
        }

        .num {
            color: #777;
            font-size: 11px;
        }

        .row-title {
            font-size: 11px;
            font-weight: bold;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .row-artist {
            font-size: 9px;
            color: #777;
            margin-top: 3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .row-time {
            font-size: 9px;
            color: #888;
        }

        /* ================= MUSIC PLAYER ================= */

        .player {
            position: fixed;
            left: 50%;
            bottom: 20px;
            transform: translateX(-50%);
            width: min(650px, 92%);
            padding: 16px 18px;
            background: rgba(20, 20, 20, 0.88);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            backdrop-filter: blur(20px);
            z-index: 100;
            box-shadow: 0 15px 50px #000;
        }

        .player-top {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 11px;
        }

        .track {
            color: var(--blue);
            font-weight: bold;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            min-width: 0;
            flex: 1;
        }

        .time {
            color: #aaa;
            flex-shrink: 0;
        }

        /* ================= MUSIC BAR ANIMATION ================= */

        .music-animation {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 3px;
            height: 22px;
            width: 45px;
            flex-shrink: 0;
        }

        .music-animation span {
            display: block;
            width: 3px;
            height: 5px;
            border-radius: 3px;
            background: var(--blue);
            box-shadow: 0 0 6px var(--blue);

            animation: musicBars 0.8s ease-in-out infinite;
            animation-play-state: paused;
        }

        .music-animation span:nth-child(1) {
            animation-delay: -0.7s;
        }

        .music-animation span:nth-child(2) {
            animation-delay: -0.5s;
        }

        .music-animation span:nth-child(3) {
            animation-delay: -0.3s;
        }

        .music-animation span:nth-child(4) {
            animation-delay: -0.1s;
        }

        .music-animation span:nth-child(5) {
            animation-delay: -0.4s;
        }

        .music-animation span:nth-child(6) {
            animation-delay: -0.6s;
        }

        .music-animation span:nth-child(7) {
            animation-delay: -0.2s;
        }

        .music-animation.playing span {
            animation-play-state: running;
        }

        @keyframes musicBars {

            0%,
            100% {
                height: 5px;
                opacity: 0.5;
            }

            50% {
                height: 21px;
                opacity: 1;
            }
        }

        .progress {
            height: 6px;
            background: rgba(255, 255, 255, 0.12);
            border-radius: 10px;
            margin: 11px 0;
            cursor: pointer;
            overflow: hidden;
            touch-action: none;
        }

        .progress-fill {
            width: 0;
            height: 100%;
            background: var(--red);
            box-shadow: 0 0 10px var(--red);
        }

        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
        }

        .btn {
            background: none;
            border: 0;
            color: #fff;
            font-size: 22px;
            cursor: pointer;
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: 0.2s;
            -webkit-tap-highlight-color: transparent;
        }

        .btn:hover {
            color: var(--red);
            transform: scale(1.15);
        }

        .play-btn {
            font-size: 38px;
        }

        #yt-player {
            position: fixed;
            width: 200px;
            height: 120px;
            left: -1000px;
            bottom: 0;
            opacity: 0;
            pointer-events: none;
        }

        /* ================= WARNING ================= */

        .warning {
            display: none;
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: min(520px, 90%);
            background: #000e;
            border: 1px solid var(--red);
            border-radius: 10px;
            padding: 10px;
            text-align: center;
            font-size: 10px;
            z-index: 300;
        }

        /* =========================================================
           TABLET
        ========================================================= */

        @media (max-width: 900px) {

            .cards {
                grid-template-columns: repeat(3, 1fr);
            }

            .feature {
                grid-template-columns: 1fr;
            }

            .cassette {
                min-height: 300px;
            }
        }

        /* =========================================================
           MOBILE
        ========================================================= */

        @media (max-width: 600px) {

            body {
                padding-bottom: 125px;
            }

            header {
                padding: 18px 15px 5px;
            }

            main {
                padding: 10px 12px 16px;
            }

            .hero {
                padding: 16px 0;
            }

            h1 {
                font-size: clamp(2.5rem, 15vw, 4rem);
                text-shadow: 3px 3px var(--red);
            }

            .subtitle {
                font-size: 11px;
                line-height: 1.6;
                padding: 0 10px;
            }

            .section {
                margin: 20px 0;
            }

            .section-head {
                align-items: flex-end;
                margin-bottom: 10px;
            }

            .section-title {
                font-size: 15px;
            }

            .section-label {
                font-size: 8px;
            }

            .status {
                font-size: 9px;
            }

            .badge {
                font-size: 9px;
                padding: 5px 8px;
            }

            /* Feature panels */

            .feature {
                display: flex;
                flex-direction: column;
                gap: 14px;
            }

            .panel {
                padding: 14px;
                border-radius: 14px;
            }

            /* Cassette */

            .cassette {
                min-height: 230px;
                padding: 10px;
            }

            .cassette-box {
                width: 92%;
                height: 190px;
                padding: 9px;
                border-width: 3px;
            }

            .cassette-label {
                padding: 10px;
            }

            .cassette-label strong {
                font-size: 18px;
            }

            .reels {
                gap: 45px;
                margin-bottom: 20px;
            }

            .reel {
                width: 70px;
                height: 70px;
                border-width: 5px;
            }

            /* Party hours */

            .list {
                max-height: 295px;
                gap: 6px;
            }

            .list-row {
                grid-template-columns: 25px minmax(0, 1fr) 20px;
                min-height: 55px;
                padding: 8px;
                gap: 8px;
            }

            .num {
                font-size: 9px;
            }

            .row-title {
                font-size: 10px;
            }

            .row-artist {
                font-size: 8px;
            }

            .row-time {
                font-size: 10px;
                text-align: center;
            }

            /* Music player */

            .player {
                width: calc(100% - 20px);
                bottom: 10px;
                padding: 12px 12px 10px;
                border-radius: 16px;
            }

            .player-top {
                font-size: 9px;
                gap: 8px;
            }

            .music-animation {
                width: 38px;
                height: 18px;
                gap: 2px;
            }

            .music-animation span {
                width: 2.5px;
            }

            @keyframes musicBars {

                0%,
                100% {
                    height: 4px;
                }

                50% {
                    height: 17px;
                }
            }

            .progress {
                height: 6px;
                margin: 9px 0;
            }

            .controls {
                gap: 20px;
            }

            .btn {
                width: 44px;
                height: 44px;
                font-size: 19px;
            }

            .play-btn {
                font-size: 32px;
            }
        }

        /* =========================================================
           VERY SMALL PHONES
        ========================================================= */

        @media (max-width: 380px) {

            h1 {
                font-size: 2.3rem;
            }

            .subtitle {
                font-size: 10px;
            }

            .section-title {
                font-size: 13px;
            }

            .section-label {
                font-size: 7px;
            }

            .cassette-box {
                height: 170px;
            }

            .reels {
                gap: 35px;
                margin-bottom: 15px;
            }

            .reel {
                width: 48px;
                height: 48px;
            }

            .cassette-label strong {
                font-size: 12px;
            }

            .list {
                max-height: 280px;
            }

            .controls {
                gap: 15px;
            }

            .btn {
                width: 42px;
                height: 42px;
            }
        }
    </style>
</head>

        let currentSongIndex = 0;
        let yt = null;
        let ytReady = false;
        let timer = null;

        const playButton = document.getElementById("play");
        const nextButton = document.getElementById("next");
        const prevButton = document.getElementById("prev");
        const trackTitle = document.getElementById("track-title");
        const progressBar = document.getElementById("progress");
        const progressContainer = document.getElementById("progress-container");
        const cassette = document.getElementById("cassette");
        const timeDisplay = document.getElementById("time");
        const playlistList = document.querySelector(".list");
        const warning = document.getElementById("warning");

        /* NEW: Music animation element */
        const musicAnimation = document.getElementById("musicAnimation");

        /* =========================================================
           QUOTES
        ========================================================= */

        const quotes = [
            '"Yaaron dosti badi hi haseen hai..."',
            '"Pal, ye hai pyaar ke pal..."',
            '"Beete lamhe... woh baatein, woh yaadein."',
            '"Zindagi do pal ki... sirf do pal ki."',
            '"Cyber Cafe @ 20/hr is where we lived."',
            '"Hero lag raha hai bhai tera!"'
        ];

        let quoteIndex = 0;

        const quoteElement = document.getElementById("quote");

        if (quoteElement) {
            setInterval(() => {
                quoteIndex =
                    (quoteIndex + 1) % quotes.length;

                quoteElement.style.opacity = 0;

                setTimeout(() => {
                    quoteElement.textContent =
                        quotes[quoteIndex];

                    quoteElement.style.opacity = 1;
                }, 300);

            }, 4000);
        }

        /* =========================================================
           PARTY HOURS LIST
        ========================================================= */

        function renderSongs() {

            playlistList.innerHTML = "";

            SONGS.forEach((song, index) => {

                const row =
                    document.createElement("div");

                row.className =
                    "list-row" +
                    (index === currentSongIndex
                        ? " active"
                        : "");

                row.dataset.index = index;

                row.innerHTML = `
                    <div class="num">
                        ${String(index + 1).padStart(2, "0")}
                    </div>

                    <div>
                        <div class="row-title">
                            ${escapeHtml(song.title)}
                        </div>

                        <div class="row-artist">
                            ${escapeHtml(song.artist)}
                        </div>
                    </div>

                    <div class="row-time">
                        ▶
                    </div>
                `;

                row.addEventListener("click", () => {
                    selectSong(index);
                });

                playlistList.appendChild(row);
            });
        }

        function escapeHtml(value) {

            const element =
                document.createElement("div");

            element.textContent = value;

            return element.innerHTML;
        }

        /* =========================================================
           SELECT SONG
        ========================================================= */

        function selectSong(index) {

            if (!ytReady || !yt) {

                trackTitle.textContent =
                    "YouTube player is loading...";

                return;
            }

            const song = SONGS[index];

            if (!song || !song.videoId) {

                trackTitle.textContent =
                    "Unable to play this song.";

                return;
            }

            currentSongIndex = index;

            trackTitle.textContent =
                song.title + " • " + song.artist;

            updateActiveSong();

            yt.loadVideoById(song.videoId);
        }

        function updateActiveSong() {

            document
                .querySelectorAll(".list-row")
                .forEach(row => {

                    row.classList.toggle(
                        "active",
                        Number(row.dataset.index) ===
                        currentSongIndex
                    );

                });

            const activeRow =
                document.querySelector(
                    `.list-row[data-index="${currentSongIndex}"]`
                );

            if (activeRow) {

                activeRow.scrollIntoView({
                    behavior: "smooth",
                    block: "nearest"
                });
            }
        }

        /* =========================================================
           YOUTUBE IFRAME API
        ========================================================= */

        const youtubeScript =
            document.createElement("script");

        youtubeScript.src =
            "https://www.youtube.com/iframe_api";

        document.head.appendChild(youtubeScript);

        function onYouTubeIframeAPIReady() {

            const playerVars = {

                autoplay: 0,
                controls: 0,
                playsinline: 1,
                rel: 0,
                modestbranding: 1
            };

            if (
                location.protocol === "http:" ||
                location.protocol === "https:"
            ) {

                playerVars.origin =
                    location.origin;
            }

            yt = new YT.Player(
                "yt-player",
                {
                    width: "1",
                    height: "1",

                    playerVars,

                    events: {
                        onReady: onPlayerReady,
                        onStateChange:
                            onPlayerStateChange,
                        onError: onPlayerError
                    }
                }
            );
        }

        function onPlayerReady() {

            ytReady = true;

            trackTitle.textContent =
                SONGS[currentSongIndex].title +
                " • " +
                SONGS[currentSongIndex].artist;

            updateActiveSong();
        }

        /* =========================================================
           PLAYER STATE
        ========================================================= */

        function onPlayerStateChange(event) {

            if (!ytReady) return;

            /* ================= PLAYING ================= */

            if (
                event.data ===
                YT.PlayerState.PLAYING
            ) {

                playButton.textContent = "⏸";

                cassette.classList.add("playing");

                /* START MUSIC BAR ANIMATION */
                musicAnimation.classList.add(
                    "playing"
                );

                startTimer();

                const status =
                    document.getElementById("status");

                if (status) {
                    status.textContent =
                        "Playing • Party Hours";
                }
            }

            /* ================= PAUSED ================= */

            else if (
                event.data ===
                YT.PlayerState.PAUSED
            ) {

                playButton.textContent = "▶";

                cassette.classList.remove("playing");

                /* STOP MUSIC BAR ANIMATION */
                musicAnimation.classList.remove(
                    "playing"
                );

                stopTimer();

                const status =
                    document.getElementById("status");

                if (status) {
                    status.textContent =
                        "Online • Party Hours";
                }
            }

            /* ================= ENDED ================= */

            else if (
                event.data ===
                YT.PlayerState.ENDED
            ) {

                playButton.textContent = "▶";

                cassette.classList.remove("playing");

                /* STOP MUSIC BAR ANIMATION */
                musicAnimation.classList.remove(
                    "playing"
                );

                stopTimer();

                playNextSong();
            }

            /* ================= BUFFERING ================= */

            else if (
                event.data ===
                YT.PlayerState.BUFFERING
            ) {

                /* STOP ANIMATION WHILE BUFFERING */
                musicAnimation.classList.remove(
                    "playing"
                );

                trackTitle.textContent =
                    SONGS[currentSongIndex].title +
                    "...";
            }
        }

        /* =========================================================
           YOUTUBE ERROR
        ========================================================= */

        function onPlayerError(event) {

            console.error(
                "YouTube player error:",
                event.data
            );

            const song =
                SONGS[currentSongIndex];

            if (
                event.data === 101 ||
                event.data === 150
            ) {

                trackTitle.textContent =
                    song.title +
                    " • Cannot be played";

            } else if (event.data === 153) {

                trackTitle.textContent =
                    "YouTube requires localhost for this player";

                warning.style.display = "block";

            } else {

                trackTitle.textContent =
                    song.title +
                    " • Unable to play";
            }

            playButton.textContent = "▶";

            cassette.classList.remove("playing");

            /* STOP MUSIC BAR */
            musicAnimation.classList.remove(
                "playing"
            );

            stopTimer();
        }

        /* =========================================================
           PLAYER CONTROLS
        ========================================================= */

        playButton.addEventListener(
            "click",
            () => {

                if (!ytReady || !yt) return;

                const state =
                    yt.getPlayerState();

                if (
                    state ===
                    YT.PlayerState.PLAYING
                ) {

                    yt.pauseVideo();

                } else {

                    if (
                        state ===
                        YT.PlayerState.UNSTARTED ||
                        state ===
                        YT.PlayerState.CUED ||
                        state === -1
                    ) {

                        selectSong(
                            currentSongIndex
                        );

                    } else {

                        yt.playVideo();
                    }
                }
            }
        );

        nextButton.addEventListener(
            "click",
            () => {
                playNextSong();
            }
        );

        prevButton.addEventListener(
            "click",
            () => {

                if (currentSongIndex > 0) {

                    currentSongIndex--;

                    selectSong(
                        currentSongIndex
                    );
                }
            }
        );

        function playNextSong() {

            if (
                currentSongIndex <
                SONGS.length - 1
            ) {

                currentSongIndex++;

                selectSong(
                    currentSongIndex
                );

            } else {

                currentSongIndex = 0;

                selectSong(
                    currentSongIndex
                );
            }
        }

        /* =========================================================
           PROGRESS BAR
        ========================================================= */

        function startTimer() {

            stopTimer();

            timer = setInterval(() => {

                if (!yt || !ytReady) return;

                const currentTime =
                    yt.getCurrentTime();

                const duration =
                    yt.getDuration();

                if (!duration) return;

                progressBar.style.width =
                    (currentTime / duration * 100) +
                    "%";

                const minutes =
                    Math.floor(currentTime / 60);

                const seconds =
                    Math.floor(currentTime % 60);

                timeDisplay.textContent =
                    minutes +
                    ":" +
                    (seconds < 10 ? "0" : "") +
                    seconds;

            }, 500);
        }

        function stopTimer() {

            if (timer) {

                clearInterval(timer);

                timer = null;
            }
        }

        progressContainer.addEventListener(
            "click",
            event => {

                if (!ytReady || !yt) return;

                const rect =
                    progressContainer
                        .getBoundingClientRect();

                const percentage =
                    (event.clientX - rect.left) /
                    rect.width;

                const duration =
                    yt.getDuration();

                if (duration) {

                    yt.seekTo(
                        duration *
                        Math.max(
                            0,
                            Math.min(
                                1,
                                percentage
                            )
                        ),
                        true
                    );
                }
            }
        );

        /* =========================================================
           KEYBOARD CONTROLS
        ========================================================= */

        document.addEventListener(
            "keydown",
            event => {

                if (event.code === "Space") {

                    event.preventDefault();

                    playButton.click();
                }

                if (
                    event.code ===
                    "ArrowRight"
                ) {

                    nextButton.click();
                }

                if (
                    event.code ===
                    "ArrowLeft"
                ) {

                    prevButton.click();
                }
            }
        );

        /* =========================================================
           INITIALISE
        ========================================================= */

        renderSongs();

        if (location.protocol === "file:") {

            warning.style.display = "block";

            warning.innerHTML =
                "For reliable YouTube playback, open this page through a local web server.<br>" +
                "Run <b>npx serve .</b> and open the localhost address.";

            const status =
                document.getElementById("status");

            if (status) {

                status.textContent =
                    "Local file — use localhost";
            }
        }

    </script>
